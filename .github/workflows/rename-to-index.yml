name: Rename uploaded HTML to index.html

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          if [ -f bei-da-hu-xue-dao-zhi-liang-hu-dong-di-tu.html ]; then
            git config user.name "tianyi2014"
            git config user.email "tianyi2014@users.noreply.github.com"
            git mv bei-da-hu-xue-dao-zhi-liang-hu-dong-di-tu.html index.html
            git commit -m "Rename uploaded HTML to index.html"
            git push
          else
            echo "Source file not present; nothing to rename."
          fi
