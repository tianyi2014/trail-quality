name: Rename uploaded file

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename uploaded file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv bei-da-hu-xue-dao-zhi-liang-hu-dong-di-tu.html index.html
          git commit -m "Rename uploaded file to index.html"
          git push
