name: Rename HTML to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename file to index.html
        run: |
          git mv bei-da-hu-xue-dao-zhi-liang-hu-dong-di-tu.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename bei-da-hu-xue-dao-zhi-liang-hu-dong-di-tu.html to index.html"
          git push
